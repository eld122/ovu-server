# Fly.io:  fly launch --no-deploy   (keep this file)  ->  fly volumes create ovu_data --size 1
#          fly secrets set JWT_SECRET=... GOOGLE_CLIENT_ID=... (etc)  ->  fly deploy
app = "ovu-server"

[env]
  NODE_ENV = "production"
  OVU_DATA_DIR = "/data"
  PORT = "3000"

[mounts]
  source = "ovu_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # WebSocket rooms (collab/ghosts) need the process to stay up
  min_machines_running = 1

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
